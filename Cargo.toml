[package]
name = "editor_terminal"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui = { git = "https://github.com/tristanpoland/zed", rev="2047043a00dc138e3d8127c8921c96927acea8f8", features = ["runtime_shaders", "macos-blade"] }
plugin_editor_api = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "ce3078c9e56241e122f3b73ae52e114b7fdba53d" }
ui = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "ce3078c9e56241e122f3b73ae52e114b7fdba53d" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.41"

# Terminal dependencies
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty.git", branch = "add-hush-login-flag" }
portable-pty = "0.8"
which = "6"
libc = "0.2"
anyhow = "1.0"
smallvec = "1"
futures = "0.3"
itertools = "0.13"
uuid = { version = "1.0", features = ["v4"] }
smol = "1"
parking_lot = "0.12"
